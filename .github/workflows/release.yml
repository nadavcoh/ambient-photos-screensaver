name: Build & Release

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - uses: actions/setup-node@v5
      with:
        node-version: 22.x

    # enyo-dev and the enyojs libs are ancient and assume pre-v7 npm
    # peer-dep resolution. If `npm ci` starts failing on a modern Node,
    # pin back to 20.x here before debugging anything else.
    - run: npm ci

    # Guard: appinfo.json's version comes from package.json via
    # tools/sync-version.js, which only runs on `npm version`. Tagging
    # by hand silently ships an ipk whose version doesn't match its tag.
    - name: Check tag matches package version
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        PKG="$(node -p "require('./package.json').version")"
        APP="$(node -p "require('./appinfo.json').version")"
        if [ "$TAG" != "$PKG" ] || [ "$PKG" != "$APP" ]; then
          echo "::error::Version mismatch - tag=$TAG package.json=$PKG appinfo.json=$APP"
          echo "Use 'npm version <patch|minor|major> && git push --follow-tags'."
          exit 1
        fi

    - run: npm run build -- --production
    - run: npm run package
    - run: npm run manifest

    # Globs, so the manifest filename tracks package.json's name
    # automatically instead of being hardcoded to the upstream app id.
    - uses: softprops/action-gh-release@v2
      with:
        files: |
          *.ipk
          *.manifest.json
        prerelease: false
        fail_on_unmatched_files: true
